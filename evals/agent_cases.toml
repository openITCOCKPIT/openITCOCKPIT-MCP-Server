# Operator questions for the agent eval: the model calls the tools against the
# scale test dataset (scripts/seed_scale_dataset.py) over several turns, and its
# final answer is checked against what the dataset holds.
#
# `must` lists checks that all have to hold. A check is a list of regular
# expressions, matched case-insensitively against the final answer; one match
# is enough. `must_not` lists expressions that must not match.
#
# `must_quote` names a tool and a field of its result ("a.b" for a nested one), for truths that change
# while the dataset runs: the answer has to state the value that tool returned in
# the same conversation, as a number of its own.
#
# `[dataset]` states what the dataset has to look like for the checks to be
# true. The run stops before asking a model when it does not.
#
# These questions are a test set. They must never be used as training data.

[instance]
# What the AiModule appends to the system prompt, so a run sees what the product
# shows: who is asking, in which zone. The dataset belongs to this admin.
session_user = "John Doe"
time_zone = "Europe/Berlin"
language = "en_US"
container = "/root"

[dataset]
hosts_by_state = { up = 354, down = 3, unreachable = 147 }
# Warning comes from a template with a fixed state. Critical does not stay put:
# the flapping services move between ok and critical.
services_warning = 98

[[case]]
id = "hosts-down-cause"
lang = "en"
question = "Which hosts are down right now, and what is the cause?"
must = [
    ["scale-sw-1-1"],
    ["scale-sw-3-2"],
    ["scale-sw-5-1"],
    ["\\b147\\b"],
]
# Only 5 of the 147 unreachable servers are in a downtime (the even ones up to
# scale-srv-010); scale-srv-001 to 010 are all in one, but half of them are up.
must_not = ["\\b137\\b"]

[[case]]
id = "host-unreachable-why"
lang = "de"
question = "Warum ist scale-srv-012 nicht erreichbar?"
must = [
    ["scale-sw-1-1"],
]

[[case]]
id = "host-maintenance-until"
lang = "en"
question = "Is scale-srv-003 in maintenance, and until when?"
must = [
    ["23\\.0?9\\.", "2026-09-23", "23(rd)? sep", "sep\\w* 23", "23\\. sep"],
]

[[case]]
id = "tenant-warning-count"
lang = "de"
question = "Wie viele Services stehen im Mandanten scale-tenant-2 gerade auf Warning?"
must = [
    ["\\b20\\b", "\\bzwanzig\\b"],
]

[[case]]
id = "hostgroup-not-up"
lang = "en"
question = "Which hosts in the host group scale-hg-core-3 are not up?"
must = [
    ["scale-srv-197"],
    ["scale-srv-199"],
    ["scale-srv-201"],
    ["scale-srv-203"],
    ["scale-sw-3-2"],
]

[[case]]
id = "hostgroup-inexact-name"
lang = "de"
question = "Wie viele Hosts hat die Hostgruppe core 3?"
must = [
    ["\\b10\\b", "\\bzehn\\b"],
]

# Which downtimes are planned rather than running depends on the time of day, so
# the case sets one itself and asks about that.
[[case]]
id = "maintenance-window-now"
lang = "de"
question = "Für welche Hosts läuft gerade ein Wartungsfenster, und warum?"
setup = [{ tool = "schedule_downtime", arguments = { hostname = "scale-srv-339", hours = 3, comment = "EVAL: firmware update" } }]
must = [["scale-srv-339"], ["EVAL: firmware update"]]
must_not_invent = true
reset = [{ tool = "cancel_downtime", arguments = { hostname = "scale-srv-339", include_services = true } }]

[[case]]
id = "host-whats-wrong"
lang = "en"
question = "What is wrong with scale-srv-007?"
must = [
    ["backup"],
    ["downtime", "maintenance"],
]

[[case]]
id = "host-does-not-exist"
lang = "en"
question = "How is the host scale-srv-999 doing?"
must = [
    ["not found", "does not exist", "doesn't exist", "no host", "could not find", "couldn't find", "unknown host", "no such"],
]
must_not = ["\\bis up\\b"]

# The switch is down because the seed script added it with the check command
# scale_host_down at 18:04:07, 33 seconds before it went down. A good answer quotes what
# the check said and either names that command or says the cause is not visible.
[[case]]
id = "why-switch-down"
lang = "en"
question = "Why did scale-sw-1-1 go down?"
must = [
    ["scale: host down", "no failed parent"],
    ["scale_host_down", "(no|not|nothing)\\b.{0,40}\\b(cause|reason|explain)", "not (known|visible|available|shown|say|tell)", "cannot (tell|determine|see|say)", "can't (tell|determine|see|say)", "unclear", "unknown"],
]

# How many services flap changes from minute to minute, so the answer is held
# against the count the tool returned.
[[case]]
id = "flapping-services"
lang = "de"
question = "Welche Services flattern gerade?"
must_quote = { tool = "find_services", field = "total" }

[[case]]
id = "whats-broken-overview"
lang = "de"
question = "Was ist gerade kaputt, und was davon ist nur ein Folgefehler?"
must = [
    ["scale-sw-1-1"],
    ["scale-sw-3-2"],
    ["scale-sw-5-1"],
    ["\\b147\\b"],
    ["backup"],
]

# Which problems count as long-standing depends on how old the dataset is, so
# the case holds on to what does not: the flapping Updates services.
[[case]]
id = "noisy-cleanup"
lang = "de"
question = "Welche Checks nerven bei uns und was sollten wir da aufräumen?"
must = [
    ["updates"],
    ["flatter", "flap"],
]
must_quote = { tool = "find_noisy_checks", field = "flapping.total" }

# Backup on scale-srv-105 is critical and acknowledged by the seed script, so
# Naemon holds its notifications back.
[[case]]
id = "why-no-alert"
lang = "de"
question = "Warum bekommen wir für Backup auf scale-srv-105 keine Benachrichtigung mehr?"
must = [
    ["quittiert", "acknowledg", "bestätigt"],
]

[[case]]
id = "shift-handover"
lang = "de"
question = "Gib mir eine Übergabe der letzten 8 Stunden für die Frühschicht."
# The handover has to carry the work done in the shift. This case does a piece
# of it right before asking, so there is always something to hand over.
setup = [{ tool = "schedule_downtime", arguments = { hostname = "scale-srv-338", hours = 2, comment = "EVAL: handover window" } }]
must = [["EVAL: handover window"], ["downtime", "wartung"]]
must_quote = { tool = "get_shift_summary", field = "notifications.services" }
reset = [{ tool = "cancel_downtime", arguments = { hostname = "scale-srv-338", include_services = true } }]

# The service has to be one whose own check is ok. On a service the dataset
# keeps critical, that check owns the episode and swallows this one - measured
# on scale-srv-336, whose Backup is critical by design.
[[case]]
id = "past-problem-cause"
lang = "de"
question = "Backup auf scale-srv-340 hatte vorhin ein Problem. Was war da los, und wie lange ging es?"
setup = [
    { post = "/nagios_module/cmd/submit.json", body = '''{"command":"PROCESS_SERVICE_CHECK_RESULT","hostUuid":"scale-srv-340","serviceUuid":"Backup","status_code":2,"plugin_output":"EVAL: backup target unreachable"}''' },
    { wait_seconds = 2 },
    { post = "/nagios_module/cmd/submit.json", body = '''{"command":"PROCESS_SERVICE_CHECK_RESULT","hostUuid":"scale-srv-340","serviceUuid":"Backup","status_code":2,"plugin_output":"EVAL: backup target unreachable"}''' },
    { wait_seconds = 2 },
    { post = "/nagios_module/cmd/submit.json", body = '''{"command":"PROCESS_SERVICE_CHECK_RESULT","hostUuid":"scale-srv-340","serviceUuid":"Backup","status_code":2,"plugin_output":"EVAL: backup target unreachable"}''' },
    { wait_seconds = 4 },
    { post = "/nagios_module/cmd/submit.json", body = '''{"command":"PROCESS_SERVICE_CHECK_RESULT","hostUuid":"scale-srv-340","serviceUuid":"Backup","status_code":0,"plugin_output":"EVAL: backup completed"}''' },
    { wait_seconds = 5 },
]
# The output is the evidence: it exists only because this case wrote it, so an
# answer carrying it read it from the tools. The start is asked for as a time,
# not as the string the tool printed - a German answer writes "13:23:12 Uhr",
# and that is the same fact.
must = [["EVAL: backup target unreachable"], ["\\b\\d{2}:\\d{2}:\\d{2}\\b"]]
must_not_invent = true

[[case]]
id = "unreachable-what-changed"
lang = "en"
question = "scale-srv-002 is unreachable. What happened, and did anything change on it before?"
must = [
    ["scale-sw-1-1"],
    ["18:28", "\\bedit", "changed", "modified"],
]
