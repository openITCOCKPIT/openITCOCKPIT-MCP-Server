# Operator questions for the tool-selection eval.
#
# Each case states which tool a model should call FIRST. `tools = []` means no
# tool covers the task yet, which a run reports rather than counts as a miss.
# `args` lists the arguments that must be present with these values (strings
# compare case-insensitively; "a.b" addresses a nested key).
#
# These questions are a test set. They must never be used as training data.

[[case]]
id = "triage-broken-now"
task = "triage"
lang = "de"
question = "Was ist gerade kaputt?"
expect = { tools = ["get_problem_overview"] }

[[case]]
id = "triage-critical-services"
task = "triage"
lang = "en"
question = "Which services are critical right now?"
expect = { tools = ["find_services", "get_problem_overview"] }

[[case]]
id = "triage-unknown-services"
task = "triage"
lang = "de"
question = "Welche Services sind gerade im Zustand unknown?"
expect = { tools = ["find_services"], args = { state = ["unknown"] } }

[[case]]
id = "triage-root-cause-overview"
