# One instance per role, each limited to its own toolset.
#
# Where docker-compose.example.yml runs one unlimited server, this runs the
# division of labour the toolsets were written for: an agent pointed at an
# instance sees the tools of that role and no others, and a tool that was never
# registered cannot be called.
#
#   docker compose -f docker-compose.roles.yml up -d
#
# The important part is not the ports. Each instance gets its **own**
# openITCOCKPIT API key, because that account's permissions are what every
# client of that instance acts with. Give the reading roles an account that can
# only read; only the roles below that set OITC_ENABLE_WRITE_TOOLS need one that
# may write. Sharing one key across all of them gives every role the rights of
# the widest one and makes the split decorative.
#
# Each also gets its own MCP_AUTH_TOKEN, so access to one role is not access to
# the rest.
#
# You are not meant to run all nine. Take the roles you have an agent for.

x-role: &role
  image: openitcockpit/mcp-server:latest
  restart: unless-stopped
  healthcheck:
    # An unauthenticated request answering 401 is the healthy response: the
    # server is up and rejecting correctly. A dead container answers nothing.
    test:
      - CMD-SHELL
      - >-
        python3 -c "import urllib.request,urllib.error;
        req=urllib.request.Request('http://127.0.0.1:8000/mcp', method='POST');
        exec('try:\n urllib.request.urlopen(req, timeout=5)\nexcept urllib.error.HTTPError as e:\n raise SystemExit(0 if e.code==401 else 1)\nexcept Exception:\n raise SystemExit(1)')"
    interval: 30s
    timeout: 10s
    start_period: 10s
    retries: 3

x-role-env: &role-env
  OITC_BASEURL: "https://your-openitcockpit-instance"
  OITC_VERIFY_TLS: "true"
  OITC_TRANSPORT: "http"
  OITC_HOST: "0.0.0.0"
  OITC_PORT: "8000"
  OITC_LOG_LEVEL: "INFO"
  # Off by default. A role that only reads has nothing to gain from it, and the
  # roles that change something turn it on for themselves below.
  OITC_ENABLE_WRITE_TOOLS: "false"
  OITC_SHOW_BANNER: "false"

services:
  # ---------------------------------------------------------------- reading --

  # What is broken, since when, and whether someone is already on it.
  oitc-mcp-health:
    <<: *role
    container_name: oitc-mcp-health
    ports:
      - "8801:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "health"
      MCP_AUTH_TOKEN: "change-me-token-health"
      OITC_APIKEY: "api-key-of-a-read-only-account"

  # Availability over a period, and where a measured value is heading.
  oitc-mcp-reporting:
    <<: *role
    container_name: oitc-mcp-reporting
    ports:
      - "8802:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "reporting"
      MCP_AUTH_TOKEN: "change-me-token-reporting"
      OITC_APIKEY: "api-key-of-a-read-only-account"

  # What exists and how it is described: templates, commands, contacts, groups.
  oitc-mcp-catalog:
    <<: *role
    container_name: oitc-mcp-catalog
    ports:
      - "8803:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "catalog"
      MCP_AUTH_TOKEN: "change-me-token-catalog"
      OITC_APIKEY: "api-key-of-a-read-only-account"

  # Update and security posture across the monitored estate.
  oitc-mcp-patch:
    <<: *role
    container_name: oitc-mcp-patch
    ports:
      - "8804:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "patch"
      MCP_AUTH_TOKEN: "change-me-token-patch"
      OITC_APIKEY: "api-key-of-a-read-only-account"

  # ---------------------------------------------------------------- writing --
  # Every instance below acts with an openITCOCKPIT account that may write, and
  # every client that passes its bearer check acts with those permissions.

  # Take a problem on: acknowledge it, put it in maintenance, check again now.
  # Everything it does can be undone.
  oitc-mcp-operations:
    <<: *role
    container_name: oitc-mcp-operations
    ports:
      - "8805:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "operations"
      OITC_ENABLE_WRITE_TOOLS: "true"
      MCP_AUTH_TOKEN: "change-me-token-operations"
      OITC_APIKEY: "api-key-of-an-account-that-may-write"

  # Take a host or service into monitoring, with the services it runs.
  oitc-mcp-onboarding:
    <<: *role
    container_name: oitc-mcp-onboarding
    ports:
      - "8806:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "onboarding"
      OITC_ENABLE_WRITE_TOOLS: "true"
      MCP_AUTH_TOKEN: "change-me-token-onboarding"
      OITC_APIKEY: "api-key-of-an-account-that-may-write"

  # Change what exists, without blanking the fields nobody mentioned.
  oitc-mcp-config:
    <<: *role
    container_name: oitc-mcp-config
    ports:
      - "8807:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "config"
      OITC_ENABLE_WRITE_TOOLS: "true"
      MCP_AUTH_TOKEN: "change-me-token-config"
      OITC_APIKEY: "api-key-of-an-account-that-may-write"

  # Create the building blocks hosts and services are made of. It touches
  # nothing that already exists.
  oitc-mcp-provisioning:
    <<: *role
    container_name: oitc-mcp-provisioning
    ports:
      - "8808:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "provisioning"
      OITC_ENABLE_WRITE_TOOLS: "true"
      MCP_AUTH_TOKEN: "change-me-token-provisioning"
      OITC_APIKEY: "api-key-of-an-account-that-may-write"

  # The one role that can remove things: it takes objects out of the monitoring
  # and deletes them, and exports the configuration to the engine. Deleting a
  # host takes its services with it and cannot be undone from here. Give it the
  # narrowest account and the shortest list of clients, or leave it out.
  oitc-mcp-lifecycle:
    <<: *role
    container_name: oitc-mcp-lifecycle
    ports:
      - "8809:8000"
    environment:
      <<: *role-env
      OITC_TOOLSETS: "lifecycle"
      OITC_ENABLE_WRITE_TOOLS: "true"
      MCP_AUTH_TOKEN: "change-me-token-lifecycle"
      OITC_APIKEY: "api-key-of-an-account-that-may-write"
