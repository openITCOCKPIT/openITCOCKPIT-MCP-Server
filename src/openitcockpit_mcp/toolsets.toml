# Toolsets: named subsets of this server's tools.
#
# An instance can be limited to one or more of them, so an agent sees only the
# tools its job needs - fewer candidates, fewer wrong calls, and a tool that is
# not registered cannot be called at all.
#
#   OITC_TOOLSETS=health          one set
#   OITC_TOOLSETS=health,patch    several
#   OITC_TOOLSETS=all             everything registered - the default
#   OITC_TOOLSETS=health,get_container_tree   a set plus one more tool
#
# To use your own: copy this file next to where you start the server, or point
# OITC_TOOLSETS_FILE at it. Your file *replaces* these sets rather than adding
# to them, so what you see here is all there is to know.
#
#   cp src/openitcockpit_mcp/toolsets.toml toolsets.toml
#
# Selecting a set never widens what is available: the write tools stay
# unregistered unless OITC_ENABLE_WRITE_TOOLS=true, whatever a set names.
#
# `guides` names the material an instance limited to this set should serve as
# MCP resources: either one shipped with the server (see --list-toolsets, or
# skills/) or a path to a Markdown file of your own, relative to this file:
#
#   skills = ["oitc-incident-triage", "./your-guide.md"]
#
# The capabilities guide and the two general system prompts are served whatever
# the limit, so no set needs to name them.
#
# Tools appear in several sets on purpose. A set has to be workable on its own -
# an onboarding agent that cannot list host templates will guess names and be
# rejected - so being minimal is not the goal here.

[patch]
description = "Update and security posture across the monitored estate."
skills = ["oitc-patch-review"]
systemprompts = ["system-prompt-patch", "system-prompt-patch-de"]
tools = [
    "list_pending_updates",
    "list_pending_security_updates",
    "list_installed_software",
    "find_hosts",
    "get_host_health",
]

[catalog]
description = "Look up what exists - templates, commands, contacts, groups, containers - without changing anything."
systemprompts = ["system-prompt-catalog", "system-prompt-catalog-de"]
tools = [
    "list_catalog",
    "get_container_tree",
    "get_allowed_elements_for_container",
]

[health]
description = "Find hosts and services across the estate and see how one is doing - its state, what likely explains a problem, recent changes."
skills = ["oitc-incident-triage"]
systemprompts = ["system-prompt-health", "system-prompt-health-de"]
tools = [
    "find_hosts",
    "find_services",
    "find_downtimes",
    "get_host_health",
    "get_service_health",
    "list_catalog",
    "get_problem_overview",
    "find_noisy_checks",
    "explain_notification",
    "get_shift_summary",
    "investigate_problem",
]

[operations]
description = "Act on problems as the user asking: acknowledge them, take a maintenance window, run a check again now."
systemprompts = ["system-prompt-operations", "system-prompt-operations-de"]
tools = [
    "get_problem_overview",
    "find_hosts",
    "get_host_health",
    "get_service_health",
    "get_impact",
    "get_configuration_status",
    "acknowledge_problem",
    "remove_acknowledgement",
    "reschedule_check",
    "schedule_downtime",
    "cancel_downtime",
    "find_downtimes",
]

# The sets below name write tools. They take effect only with
# OITC_ENABLE_WRITE_TOOLS=true; otherwise they resolve to their read tools.

[lifecycle]
description = "Take hosts and services out of the monitoring, put them back, or delete them - and make it take effect."
systemprompts = ["system-prompt-lifecycle", "system-prompt-lifecycle-de"]
tools = [
    "find_hosts",
    "get_host_health",
    "get_impact",
    "stop_monitoring",
    "resume_monitoring",
    "delete_object",
    "get_configuration_status",
    "apply_configuration",
]

[onboarding]
description = "Take a host and its services into monitoring without container-scope rejections."
skills = ["oitc-host-onboarding"]
systemprompts = ["system-prompt-onboarding", "system-prompt-onboarding-de"]
tools = [
    "create_host",
    "create_service",
    "list_catalog",
    "get_allowed_elements_for_container",
    "get_container_tree",
    "get_configuration_status",
    "apply_configuration",
]

[config]
description = "Change existing objects without blanking the fields you did not mention."
skills = ["oitc-config-change"]
systemprompts = ["system-prompt-config", "system-prompt-config-de"]
tools = [
    "update_host",
    "update_service",
    "update_contact",
    "update_contactgroup",
    "get_service_config",
    "list_catalog",
    "get_allowed_elements_for_container",
    "find_hosts",
    "get_host_health",
]

[provisioning]
description = "Create the building blocks hosts and services are made of, without touching anything that exists."
systemprompts = ["system-prompt-provisioning", "system-prompt-provisioning-de"]
tools = [
    "create_hosttemplate",
    "create_servicetemplate",
    "create_command",
    "create_contact",
    "create_contactgroup",
    "create_hostgroup",
    "create_servicetemplategroup",
    "list_catalog",
    "get_allowed_elements_for_container",
    "get_container_tree",
]
