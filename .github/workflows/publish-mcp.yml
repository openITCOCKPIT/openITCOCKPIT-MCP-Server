name: Publish to MCP Registry

# Publishing the GitHub release creates the tag, which fires this. The image
# has to be on Docker Hub first - the registry verifies ownership by reading
# the io.modelcontextprotocol.server.name label off the *published* image, so
# run the Jenkins pipeline with PUBLISH=yes before publishing the release.
# workflow_dispatch stays for a rerun after a failed or out-of-order run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: the namespace is derived from the repository owner
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check server.json against MCP_VERSION and the Dockerfile label
        run: |
          set -eu
          mcp_version="$(cat MCP_VERSION)"
          name="$(jq -r .name server.json)"
          json_version="$(jq -r .version server.json)"
          identifier="$(jq -r '.packages[0].identifier' server.json)"
          label="$(grep -oE '^LABEL io\.modelcontextprotocol\.server\.name="[^"]+"' Dockerfile | cut -d'"' -f2)"

          [ "$json_version" = "$mcp_version" ] \
            || { echo "server.json version $json_version != MCP_VERSION $mcp_version"; exit 1; }
          [ "${identifier##*:}" = "$mcp_version" ] \
            || { echo "image tag ${identifier##*:} != MCP_VERSION $mcp_version"; exit 1; }
          [ "$name" = "$label" ] \
            || { echo "server.json name $name != Dockerfile label $label"; exit 1; }

          # On a tag run the tag itself is a fourth claim about the version, and
          # it is the only one a mistyped release can get wrong on its own.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$mcp_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match MCP_VERSION $mcp_version"
            exit 1
          fi

          echo "OK: $name $mcp_version -> $identifier"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
